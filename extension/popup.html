<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>YT Vision Notes</title>
<style>
  :root { color-scheme: light dark; }
  body { width: 320px; margin: 0; padding: 14px; font: 14px/1.5 "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif; }
  h1 { font-size: 16px; margin: 0 0 10px; }
  p { margin: 0 0 10px; }
  .muted { opacity: .7; font-size: 12px; }
  .row { display: flex; gap: 8px; margin-bottom: 10px; }
  button { flex: 1; height: 34px; border-radius: 8px; border: 1px solid #8884; background: #8882; font: inherit; color: inherit; cursor: pointer; }
  button.primary { background: #3e63dd; color: #fff; border-color: transparent; font-weight: 600; }
  button:disabled { opacity: .5; }
  label { display: block; font-size: 12px; opacity: .8; margin-bottom: 4px; }
  select { flex: 1; min-width: 0; height: 32px; padding: 0 6px; border-radius: 8px; border: 1px solid #8886; background: transparent; color: inherit; font: inherit; }
  select option { color: #111; }
  button.small { flex: none; width: 36px; }
  input { width: 100%; box-sizing: border-box; height: 32px; padding: 0 8px; border-radius: 8px; border: 1px solid #8886; background: transparent; color: inherit; font: inherit; }
  #err { color: #e5484d; font-size: 12px; overflow-wrap: anywhere; }
  a { color: #3e63dd; }
</style>
</head>
<body>
  <h1>YT Vision Notes</h1>
  <p id="state">Loading…</p>
  <p class="muted" id="counts"></p>
  <div class="row">
    <button id="auth" class="primary">Sign in with Google</button>
    <button id="sync">Sync now</button>
  </div>
  <p id="err"></p>
  <label for="web">Knowledge base URL (GitHub Pages)</label>
  <div class="row">
    <input id="web" type="url" placeholder="https://your-name.github.io/yt-vision-notes/">
  </div>
  <div class="row">
    <button id="open">Open knowledge base</button>
  </div>
  <label for="gkey">AI notes — Gemini API key (<a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">get one</a>)</label>
  <div class="row">
    <input id="gkey" type="password" placeholder="Paste your Gemini API key" autocomplete="off" spellcheck="false">
  </div>
  <label for="gmodel">Gemini model</label>
  <div class="row">
    <select id="gmodel"><option value="">Paste the API key first</option></select>
    <button id="grefresh" class="small" title="Reload the model list from Google">↻</button>
  </div>
  <p class="muted" id="gmsg"></p>
  <p class="muted">The key is stored only in this browser and is never synced.</p>
  <p class="muted">Click the notes icon at the bottom right of the YouTube player to open the board. Alt+S captures a frame; the panel can pop out into its own window.</p>
  <script src="ai.js"></script>
  <script src="popup.js"></script>
</body>
</html>
